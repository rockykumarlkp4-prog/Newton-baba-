<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWTON BABA - Fee Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 12px; color: #333; }
        
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center;
            align-items: center; z-index: 9999;
        }
        .login-card {
            background: white; padding: 25px; border-radius: 12px; width: 90%;
            max-width: 360px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #profileModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center;
            align-items: center; z-index: 999;
        }
        .profile-card {
            background: white; padding: 20px; border-radius: 12px; width: 92%;
            max-width: 540px; max-height: 85vh; overflow-y: auto; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .header-card { background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
        .brand-title { font-size: 20px; font-weight: 800; color: #1a73e8; margin: 0; text-transform: uppercase; }
        .brand-sub { font-size: 12px; color: #666; margin: 2px 0 10px 0; }
        
        .top-btns { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-orange { background: #ff9800; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-red { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        .nav-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn { background: #e9ecef; border: 1px solid #ced4da; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #1a73e8; color: white; border-color: #1a73e8; }

        .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 16px; font-weight: bold; color: #1a73e8; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { font-size: 12px; font-weight: bold; color: #444; display: block; margin-top: 8px; }
        input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; background: #fff; }
        
        .btn-submit { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn-excel { background: #2e7d32; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
        th { color: #555; background: #e8f0fe; font-weight: bold; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-paid { background: #d4edda; color: #155724; }
        .badge-due { background: #f8d7da; color: #721c24; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- Login System -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="color:#1a73e8; margin-top:0;">🔒 Admin Login</h2>
            <input type="password" id="loginPassword" placeholder="Enter Password">
            <button type="button" class="btn-submit" onclick="checkLogin()">Login</button>
            <p style="font-size:11px; color:#888; margin-top:12px;">Default Password: <b>1234</b></p>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContent">
        <div class="header-card">
            <h1 class="brand-title">NEWTON BABA</h1>
            <div class="brand-sub">Fee Management System</div>
            
            <div class="top-btns">
                <button type="button" class="btn-orange" onclick="changePassword()">🔑 Password</button>
                <button type="button" class="btn-red" onclick="logout()">🔒 Logout</button>
            </div>

            <div class="nav-tabs">
                <button type="button" class="tab-btn active" onclick="switchTab('entryTab', this)">➕ Entry / Record</button>
                <button type="button" class="tab-btn" onclick="switchTab('dueTab', this)">⚠️️ Due List (बकाया)</button>
            </div>
        </div>

        <!-- Entry Tab -->
        <div id="entryTab" class="tab-content active">
            <div class="card">
                <div class="card-title">➕ New Fee Entry</div>
                <form id="studentForm">
                    <div class="grid-2">
                        <div>
                            <label>Student Name</label>
                            <input type="text" id="stdName" required>
                        </div>
                        <div>
                            <label>Total Fee</label>
                            <input type="number" id="feeAmount" required>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label>Paid Amount</label>
                            <input type="number" id="paidAmount" required>
                        </div>
                        <div>
                            <label>Month</label>
                            <select id="feeMonth">
                                <option value="January">January</option>
                                <option value="February">February</option>
                                <option value="March">March</option>
                                <option value="April">April</option>
                                <option value="May">May</option>
                                <option value="June">June</option>
                                <option value="July">July</option>
                                <option value="August">August</option>
                                <option value="September">September</option>
                                <option value="October">October</option>
                                <option value="November">November</option>
                                <option value="December">December</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn-submit" onclick="addRecord()">Save Record</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">📋 All Records</div>
                <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="searchTable('recordsTable')">
                <div style="overflow-x:auto;">
                    <table id="recordsTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Month</th>
                                <th>Total</th>
                                <th>Paid</th>
                                <th>Due</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Due List Tab -->
        <div id="dueTab" class="tab-content">
            <div class="card">
                <div class="card-title" style="color:#dc3545;">⚠️ Due List (जिनका फ़ीस बाकी है)</div>
                <button type="button" class="btn-excel" onclick="exportDueList()">📊 Export Due List to Excel</button>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Month</th>
                                <th>Total</th>
                                <th>Paid</th>
                                <th>Remaining Due</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="dueTbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('nb_records')) || [];
        let adminPass = localStorage.getItem('nb_pass') || '1234';

        function checkLogin() {
            if(document.getElementById('loginPassword').value === adminPass) {
                document.getElementById('loginOverlay').style.display = 'none';
                renderData();
            } else {
                alert('गलत पासवर्ड!');
            }
        }

        function logout() {
            location.reload();
        }

        function changePassword() {
            let p = prompt('नया पासवर्ड दर्ज करें:');
            if(p) {
                localStorage.setItem('nb_pass', p);
                adminPass = p;
                alert('पासवर्ड बदल गया!');
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function addRecord() {
            let name = document.getElementById('stdName').value;
            let total = parseFloat(document.getElementById('feeAmount').value) || 0;
            let paid = parseFloat(document.getElementById('paidAmount').value) || 0;
            let month = document.getElementById('feeMonth').value;

            if(!name || total <= 0) {
                alert('कृपया सही जानकारी भरें!');
                return;
            }

            let due = total - paid;
            let status = due <= 0 ? 'Paid' : 'Due';

            db.push({ name, month, total, paid, due, status });
            localStorage.setItem('nb_records', JSON.stringify(db));
            
            document.getElementById('studentForm').reset();
            renderData();
            alert('रिकॉर्ड सेव हो गया!');
        }

        function renderData() {
            let mainTbody = document.getElementById('recordsTbody');
            let dueTbody = document.getElementById('dueTbody');
            
            mainTbody.innerHTML = '';
            dueTbody.innerHTML = '';

            db.forEach((item) => {
                let badge = item.due <= 0 ? '<span class="badge badge-paid">Paid</span>' : '<span class="badge badge-due">Due</span>';
                
                let row = `<tr>
                    <td><b>${item.name}</b></td>
                    <td>${item.month}</td>
                    <td>₹${item.total}</td>
                    <td>₹${item.paid}</td>
                    <td style="color:${item.due > 0 ? '#dc3545' : '#28a745'}; font-weight:bold;">₹${item.due}</td>
                    <td>${badge}</td>
                </tr>`;

                mainTbody.innerHTML += row;

                if(item.due > 0) {
                    dueTbody.innerHTML += row;
                }
            });
        }

        function searchTable(tableId) {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let rows = document.querySelectorAll(`#${tableId} tbody tr`);
            rows.forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(input) ? '' : 'none';
            });
        }

        function exportDueList() {
            let dueData = db.filter(item => item.due > 0);
            if(dueData.length === 0) {
                alert('कोई Due रिकॉर्ड नहीं है!');
                return;
            }
            let ws = XLSX.utils.json_to_sheet(dueData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Due_List");
            XLSX.writeFile(wb, "Newton_Baba_Due_List.xlsx");
        }
    </script>
</body>
</html>
